<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JSON Formatter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            padding: 20px;
            resize: vertical;

            font-family: monospace;
            font-size: 15px;
            line-height: 1.6;

            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            background: white;
        }

        textarea:focus {
            border-color: #555;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        #format {
            background: #222;
            color: white;
        }

        #clear {
            background: #ddd;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #c62828;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>JSON Formatter</h1>

    <p>Paste or write your JSON below and format it with one click.</p>

    <label for="editor"></label><textarea id="editor" spellcheck="false">{
    "name": "John",
    "age": 25,
    "skills": ["PHP", "Laravel", "JavaScript"],
    "active": true}
</textarea>

    <div class="actions">
        <button id="format">Format JSON</button>
        <button id="clear">Clear</button>
    </div>

    <div id="message"></div>

</div>

<script>
    const editor = document.getElementById("editor");
    const formatButton = document.getElementById("format");
    const clearButton = document.getElementById("clear");
    const message = document.getElementById("message");

    formatButton.addEventListener("click", () => {
        try {
            const json = JSON.parse(editor.value);

            editor.value = JSON.stringify(json, null, 4);

            message.textContent = "JSON formatted successfully.";
            message.className = "success";

        } catch (error) {
            message.textContent = "Invalid JSON: " + error.message;
            message.className = "error";
        }
    });

    clearButton.addEventListener("click", () => {
        editor.value = "";
        message.textContent = "";
    });
</script>

</body>
</html>
